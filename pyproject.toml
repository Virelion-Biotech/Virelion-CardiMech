[project]
name = "virelion-cardimech"
version = "0.1.0"
description = "Patient-specific cardiac mechanics and electromechanics contracts and solver orchestration for HeartTwin"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cardimech = "cardimech.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
