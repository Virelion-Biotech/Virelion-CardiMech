[project]
name = "virelion-cardimech"
version = "0.2.0"
description = "Patient-specific cardiac mechanics, electromechanics, circulation coupling, and solver orchestration for the Virelion HeartTwin stack"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
io = ["meshio>=5.3"]

[project.scripts]
cardimech = "cardimech.cli:main"
cardimech-forward = "cardimech.forward_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
